<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 in 500</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", -apple-system, sans-serif;
            background-color: #2c3e50;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-container {
            background-color: #ecf0f1;
            width: 100%;
            max-width: 800px; 
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        /* 語言切換按鈕 */
        #lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: 0.3s;
            z-index: 10;
        }
        #lang-toggle:hover {
            background-color: #7f8c8d;
        }
        
        /* 圖片通用樣式 */
        .scene-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
            background-color: #bdc3c7;
            margin-top: 20px;
        }

        /* 文字通用樣式 */
        .text-desc {
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* 開始畫面專屬樣式 */
        #start-title {
            color: #2c3e50;
            font-size: 2.5em;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        #start-btn {
            background-color: #f39c12;
            padding: 20px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            white-space: normal;
        }
        #start-btn:hover {
            background-color: #e67e22;
        }

        /* 遊戲主要畫面樣式 */
        #game-content {
            display: none; /* 初始隱藏，點擊開始後顯示 */
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .choice-btn {
            padding: 20px 25px;
            font-size: 1.1em;
            line-height: 1.5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            white-space: normal; 
            word-wrap: break-word;
        }
        .choice-btn:hover {
            background-color: #2980b9;
        }
        #result-container {
            display: none;
            margin-bottom: 20px;
        }
        .result-box {
            background-color: #dff9fb;
            padding: 20px 25px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 6px solid #22a6b3;
            text-align: left;
            font-size: 1.15em;
            line-height: 1.6;
        }
        .result-box.fact-box {
            background-color: #82de6b;
            border-left-color: #4b854d;
            color: #ffffff;
        }
        .result-box.note-box {
            background-color: #ecf0f1;
            border-left-color: #ecf0f1;
            color: #8c4a4a;
            text-align: center;
        }
        /* 按鈕並排 */
        .result-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        /* 返回重選按鈕 */
        #undo-btn {
            background-color: #95a5a6;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            flex: 1;
        }
        #undo-btn:hover {
            background-color: #7f8c8d;
        }
        #next-btn {
            background-color: #2ecc71;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            flex: 2;
        }
        #next-btn:hover {
            background-color: #27ae60;
        }

        /* 結束畫面 */
        .end-screen {
            padding: 40px 0;
            display: none;
        }
        .end-screen h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .end-screen p {
            font-size: 1.4em;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .end-screen button {
            background-color: #e74c3c;
            padding: 20px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        .end-screen button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="lang-toggle" onclick="toggleLanguage()">English</button>
        
        <!-- 開始選單畫面 -->
        <div id="start-screen">
            <h1 id="start-title"></h1>
            <img id="start-image" class="scene-img" src="start_image.png" alt="Start Menu Image">
            <div id="start-desc" class="text-desc"></div>
            <button id="start-btn" onclick="startGame()"></button>
        </div>

        <!-- 遊戲主要場景畫面 -->
        <div id="game-content">
            <img id="scene-image" class="scene-img" src="" alt="Scene Image">
            <div id="description" class="text-desc">Loading...</div>
            
            <div class="choices-container" id="choices">
                <button class="choice-btn" id="btn-a" onclick="makeChoice('A')">Choice A</button>
                <button class="choice-btn" id="btn-b" onclick="makeChoice('B')">Choice B</button>
            </div>

            <div id="result-container">
                <div id="result-text-1" class="result-box"></div>
                <div id="result-text-2" class="result-box fact-box"></div>
                <div id="result-text-3" class="result-box note-box"></div>
                <div class="result-actions">
                    <button id="undo-btn" onclick="undoChoice()">Undo</button>
                    <button id="next-btn" onclick="nextScene()">Next Scene</button>
                </div>
            </div>
        </div>

        <!-- 結束畫面 -->
        <div id="end-screen" class="end-screen">
            <h1 id="end-title"></h1>
            <img id="end-image" class="scene-img" src="end_image.png" alt="End Screen Image">
            <p id="end-desc"></p>
            <div id="end-note" class="result-box note-box"></div>
            <button id="replay-btn" onclick="location.reload()"></button>
        </div>
    </div>

    <script>
        // Button Content
        const uiText = {
            zh: {
                toggleBtn: "English",
                startTitle: "1 in 500",
                startDesc: "1 in 500：HIV感染者的處境",
                startBtn: "開始遊戲",
                undoBtn: "重新選擇",
                nextBtn: "前往下一幕",
                endTitle: "你現在是其中之一了。500分之1。",
                endDesc: "那一夜過去了。訊息讀過了。結果在你手上。接下來發生的，不是一個決定——而是上百個小小的決定，橫跨幾個月、幾年。你告訴誰。你什麼時候開始治療。當你感覺沒事的時候，還會不會去覆診。你讓不讓自己被愛。",
                endNote: "遊戲在這裡結束。但你的人生還沒有。",
                replayBtn: "再玩一次",
                imgError: "圖片缺失"
            },
            en: {
                toggleBtn: "繁體中文",
                startTitle: "1 in 500",
                startDesc: "1 in 500:  What a person living with HIV faces",
                startBtn: "Start Game",
                undoBtn: "Back",
                nextBtn: "Proceed to Next Scene",
                endTitle: "You are one of them now. One in 500.",
                endDesc: "The night is over. The message is read. The result is in your hand. What happens next is not a single decision — it is a hundred small ones, made over months and years. Who you tell. When you start treatment. Whether you keep going to appointments when you feel fine. Whether you let yourself be loved.",
                endNote: "The game ends here. Your life doesn't.",
                replayBtn: "Play Again",
                imgError: "Image not found"
            }
        };

        // Scene Content
        const scenes = [
            {
                image: "image_1.png",
                description: {
                    zh: "【場景一：夜晚】你們已經交往了三天。今晚，事情進展得比以往更快。你伸手去抽屜裡找安全套。她靠過來，聲音很輕：「沒關係，我今天是安全期。」氣氛溫熱，她在等你。",
                    en: "[Scene 1: Night] You have been seeing this person for three days. Tonight, things are moving faster than before. You reach for the drawer, attempting to get the condom. She said, \"It is fine; I am in my safe period.\” The atmosphere is good, and your partner is waiting."
                },
                choices: {
                    A: { 
                        text: { zh: "「就這一次，沒關係。」", en: "It’s fine. Just this once." }, 
                        result: { zh: ["事情發生了。房間慢慢安靜下來。感覺很好。", 
                                       "你想起在哪裡聽過，HIV可以透過無保護性行為傳播。但性行為之後，仍然可以預防。如果你發生了高危性行為，PEP（暴露後預防）在72小時內開始服用可以預防感染，越早開始越好。如果你有性生活，檢測是唯一知道自己狀態的方法。",
                                       "一次的意外，定義不了你是誰，你只要知道下一步要做什麼。"],
                                  en: ["It happened; it felt good.", 
                                       "HIV can be transmitted through unprotected sex. After sex, it is still preventable. If you had unprotected sex, PEP (post-exposure prophylaxis) can prevent infection if the first dose is taken within 72 hours, but ideally within 24 hours, and it should be started as soon as possible. The HK government recommends that anyone “who has had sex should get tested at least once”. People with new or ongoing risk exposure (e.g. multiple sex partners, sex workers, men who have sex with men) should undergo regular HIV testing.",
                                       "One night does not define you. All you need to know is what the next step is."] } 
                    },
                    B: { 
                        text: { zh: "「我們停下吧，我還沒有做保護措施。」", en: "Let’s stop. I don’t have protection yet." }, 
                        result: { zh: ["你說了出來。房間的溫度降了一度。她說：「你說得對。性行為應該使用安全套這樣的保護措施。」（安全套預防HIV的有效率約為80–95%）(https://pubmed.ncbi.nlm.nih.gov/9141163/) 結果發現安全套已經用完了，她說沒關係。無保護性行為還是發生了。", 
                                       "你想起在哪裡聽過，HIV可以透過無保護性行為傳播。但性行為之後，仍然可以預防。如果你發生了高危性行為，PEP（暴露後預防）在72小時內開始服用可以預防感染，越早開始越好。如果你有性生活，檢測是唯一知道自己狀態的方法。",
                                       "一次的意外，定義不了你是誰，你只要知道下一步要做什麼。"],
                                  en: ["You say it. The atmosphere in the room cools. She said, \"You are right. Protective measures like condoms should be used for sex.\" Condoms are 90 to 95% effective when used consistently (https://pubmed.ncbi.nlm.nih.gov/9141163/). However, all the condoms are used up, but your partner said, ‘It doesn’t matter.’ Unprotected sex is performed.", 
                                       "HIV can be transmitted through unprotected sex. After sex, it is still preventable. If you had unprotected sex, PEP (post-exposure prophylaxis) can prevent infection if the first dose is taken within 72 hours, but ideally within 24 hours, and it should be started as soon as possible. The HK government recommends that anyone “who has had sex should get tested at least once”. People with new or ongoing risk exposure (e.g. multiple sex partners, sex workers, men who have sex with men) should undergo regular HIV testing.",
                                       "One night does not define you. All you need to know is what the next step is."] }
                    }
                }
            },
            {
                image: "image_2.png",
                description: {
                    zh: "【場景二：那條訊息】那一夜之後，你醒來。你還在回味，很快就把這件事忘了，繼續過正常生活。兩/三個星期後，你的手機響了。一條陌生號碼的WhatsApp訊息。「嘿，我是那天晚上的 Jane。我剛發現自己感染了HIV。你應該去檢測一下。」你盯著螢幕，文字一動不動。你腦裡一片空白。你完全震驚了，不知道該怎麼辦。你也不確定去哪裡、怎麼做HIV檢測。",
                    en: "[Scene 2] After the night, you wake up. You were content and you quickly forgot what happened. You continue with your normal life. Two weeks later. Your phone buzzes. An unknown WhatsApp message pops out. Hey. It is Jane from that night. I just found out I have HIV. You should get tested. You stare at the screen. The words don’t move; you are shocked and don’t know what to do. You are not sure where or how to get an HIV test."
                },
                choices: {
                    A: { 
                        text: { zh: "當作什麼都沒發生。告訴自己你沒事。", en: "Assume nothing happens. Tell yourself you are fine." }, 
                        result: { zh: ["你把手機扣在桌上。你刪掉了聊天記錄。你去上班、吃午飯。你覺得這兩三個星期以來什麼都沒變。某天晚上，你睡不著，發現自己發燒、發冷。你檢查自己的皮膚和喉嚨，發現和HIV皮疹的特徵很像。你打開手機；你知道這次不能再拖了，於是搜尋HIV檢測。", 
                                       "事實： 逃避是面對恐懼的正常反應，但它會延誤治療。HIV如果不治療，會隨著時間削弱免疫系統。越早檢測，越早可以行動。",
                                       "（HIV資源列表）"],
                                  en: ["You put your phone face down. You delete the chat. You go to work, eat lunch. You felt nothing had changed after these three weeks. One night, you couldn't sleep, finding yourself with a fever and chills. You checked your skin and throat and found rashes similar to an HIV rash. You turned on your phone; you knew you couldn't delay this anymore, so you searched for HIV testing.", 
                                       "Fact: Avoidance is a normal response to fear, but it delays treatment. HIV, if left untreated, weakens the immune system over time. The earlier you test, the earlier you can act.",
                                       "(HIV resources list)"] } 
                    },
                    B: { 
                        text: { zh: "今天就預約檢測。", en: "Book a test. Today." }, 
                        result: { zh: ["你找到一家機構。你打電話。「我想預約HIV檢測。」電話那頭的人很平靜、很友善跟你說你可以選擇明天來諮詢醫生，或者可以先領取一個檢測試劑盒。你掛斷電話。你坐在床上。你覺得自己快要吐了。但你預約了。這已經是一種行動。", 
                                       "事實： 在香港，公共衛生診所（例如紅絲帶中心、關懷艾滋）的HIV檢測是免費且保密的。你不需要轉介信。在某些中心，你不需要提供真實姓名。檢測是唯一知道自己狀態的方法。",
                                       "（HIV資源列表）"],
                                  en: ["You find an organization. You call. \“I would like to book an HIV test.\” The person on the line is calm and kind and tell you can come consult the doctor tomorrow, or you can choose to pick up a test kit. You hang up. You sit on your bed. You feel like you are going to be sick. But you booked the test. You took a brave step forward.", 
                                       "Fact: HIV testing in Hong Kong is free through the Department of Health’s HIV Testing Services, and the self-test kit can be done at home. However, it requires you to register and upload your HIV test results to the platform. HIV counselling and testing services are free, anonymous, and confidential at AIDS Foundation, but require you to go to their centres in person. You do not need a referral. Testing is the only way to know your status.",
                                       "(HIV resources list)"] }
                    }
                }
            },
            {
                image: "image_3.png",
                description: {
                    zh: "【場景三：兩種檢測】做了一些資料搜集後，你發現檢測方法有兩種。你會選哪一種？",
                    en: "[Scene 3] After a bit of research, you find out that testing methods can be 2 kinds. What will you choose?"
                },
                choices: {
                    A: { 
                        text: { zh: "快速抗原檢測——採血，20分鐘內出結果", en: "Rapid antigen test: uses blood and obtains results within 20 minutes." }, 
                        result: { zh: ["你網購了一個快速抗原檢測試劑盒。你很快做了檢測，結果是陰性；你鬆了一口氣。但一個月後，症狀還沒有消退。你再次訂購試劑盒，這一次結果是陽性。你很擔心，也責怪為什麼第一個試劑盒這麼不準？", 
                                       "事實： 快速檢測試劑盒的空窗期最長可達3個月，如果你的高危性行為發生在幾週內，結果可能不準確。血液中病毒量和抗原量低時，可能產生假結果。",
                                       "這不是世界末日"],
                                  en: ["You ask for a delivery of a rapid antigen test. You quickly did the test and found the test results negative; you were relieved. After 1 month, the symptoms still did not go away. You re-ordered a test kit, and this time the result was positive. You are concerned and blamed the first test kit: why was it not accurate?", 
                                       "Fact:A rapid test kit has a window period of 3 months, which means it cannot detect ALL new HIV infections within these 3 months. The results may not be precise if suspected HIV infection happened within weeks. A false result may be due to the body not producing enough viral markers for detection.  It is recommended that people get tested 90 days after suspected infection.",
                                       "It is not the end of the world."] } 
                    },
                    B: { 
                        text: { zh: "去診所抽血，送實驗室化驗", en: "Go to a clinic and have blood drawn to obtain results." }, 
                        result: { zh: ["護士叫你不用擔心，她幫你抽血並將樣本送往實驗室。一週後報告顯示 HIV 篩查呈陽性，醫生說要再抽血確認。你很擔心。幾日後，確認測試同樣呈陽性。醫生為你轉介專科、驗病毒量、務求盡快開始治療。", 
                                       "事實： 傳統抽血採用另一種檢測方法，更精確，可作為診斷標準。但如果你有高危、頻繁的性行為，無論異性戀還是同性戀，仍建議每3–6個月檢測一次。",
                                       "這不是世界末日。"],
                                  en: ["The nurse tells you not to worry; she draws blood and sends it to the laboratory. The screening results are returned in 1 week. Results are returned positive. The doctor tells you a confirmation test is needed. You are worried. After a few days, the result came back with the same positive result. The doctor referred you to the infectious disease clinic to test the viral load in order to start treatment as soon as possible.", 
                                       "Fact: Conventional blood testing is different from rapid HIV tests. It is more precise and acts as a diagnostic criterion. But it is still recommended to test every 3-6 months if you have high-risk behaviours (e.g., having multiple partners, conducting sex work, use of intravenous drugs), whether you are heterosexual or homosexual.",
                                       "It is not the end of the world."] }
                    }
                }
            },
            {
                image: "image_4.png",
                description: {
                    zh: "【場景四】得到陽性結果後，你非常恐慌。",
                    en: "[Scene 4] After getting the positive results, you are so panicked."
                },
                choices: {
                    A: { 
                        text: { zh: "埋在心中", en: "Not telling anyone." }, 
                        result: { zh: ["你把報告摺好，收起來。你告訴自己，一個人處理就好。和家人吃飯時，有人問你還好嗎、需要幫助嗎——你說只是有點累。你一個人去覆診。你一個人扛著。", 
                                       "事實： 選擇不披露，是一個關於何時、向誰開口的決定，不是失敗。在香港，接受治療不需要披露。輔導服務和同伴支援，正是為還沒準備好告訴任何人的人而設。你可以只跟一個人說，而不必告訴所有人。",
                                       "有些日子，它像個秘密；有些日子，它感覺像道高牆。"],
                                  en: ["You fold the result and put it away. You tell yourself you'll deal with it alone. At dinner with your family, someone asks if you're okay; you say you're just tired. You go to your appointment alone. You carry it by yourself.", 
                                       "Fact: Choosing not to disclose is a valid decision, not a failure. Disclosure is not required to access treatment in Hong Kong. Counselling services and peer support exist for people who are not ready to tell anyone — you can talk to someone without telling everyone.",
                                       "Some days it feels like a secret. Some days it feels like a wall."] } 
                    },
                    B: { 
                        text: { zh: "告訴其他人", en: "Tell your family and friends." }, 
                        result: { zh: ["你先選一個人——你最信任的那個。你第一次把話說出口。聲音在抖。對方沉默了一下，然後說：「好。你需要什麼？」下一次開口，容易了一點。不是每個人都接受得好。有一個人隔了很久才回電話。但你不再是一個人扛著。", 
                                       "事實： 披露沒有唯一「正確」的方式。先告訴一個信任的人，是常見的做法。在香港，醫務社工和HIV輔導員可以幫你計劃怎樣說、什麼時候說、跟誰說——也可以在你說的時候陪著你。",
                                       "有人選擇公開，有人選擇不說，大多數人只告訴少數幾個。"],
                                  en: ["You pick one person first — the one you trust most. You say it out loud for the first time. Your voice shakes. They go quiet, then they say: \"Okay. What do you need?\" The next conversation is easier. Not all of them take it well. One of them doesn't call back for a while. But you are no longer carrying it alone.", 
                                       "Fact: There is no single \"right\" way to disclose. Telling one trusted person first is a common approach. In Hong Kong, medical social workers and HIV counsellors can help you plan how, when, and to whom to disclose — and can be there when you do.",
                                       "Some people disclose to everyone; some to no one; most to a few."] }
                    }
                }
            }
        ];

        // 遊戲狀態變數
        let currentSceneIndex = 0;
        let currentLanguage = 'zh'; // 預設語言為繁體中文
        let currentChoice = null;   // 記錄當下選擇了哪個選項
        let gameState = 'start';    // 'start', 'playing', 'end'

        // DOM 元素
        const langToggleBtn = document.getElementById('lang-toggle');
        const startScreen = document.getElementById('start-screen');
        const gameContent = document.getElementById('game-content');
        const endScreen = document.getElementById('end-screen');
        const endImage = document.getElementById('end-image');
        
        const sceneImage = document.getElementById('scene-image');
        const startImage = document.getElementById('start-image');
        const descriptionEl = document.getElementById('description');
        const choicesDiv = document.getElementById('choices');
        const btnA = document.getElementById('btn-a');
        const btnB = document.getElementById('btn-b');
        const resultContainer = document.getElementById('result-container');
        const resultBoxes = [
            document.getElementById('result-text-1'),
            document.getElementById('result-text-2'),
            document.getElementById('result-text-3')];
        const undoBtn = document.getElementById('undo-btn');
        const nextBtn = document.getElementById('next-btn');

        // 生成 SVG 錯誤圖片的輔助函數
        function getErrorImageSvg(msg) {
            return `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='350' viewBox='0 0 800 350'%3E%3Crect fill='%23bdc3c7' width='800' height='350'/%3E%3Ctext fill='%237f8c8d' x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='24'%3E${msg}%3C/text%3E%3C/svg%3E`;
        }

        // 切換語言功能
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        // 更新畫面上的所有文字
        function updateUI() {
            langToggleBtn.textContent = uiText[currentLanguage].toggleBtn;
            const errorMsg = uiText[currentLanguage].imgError;
            
            if (gameState === 'start') {
                document.getElementById('start-title').textContent = uiText[currentLanguage].startTitle;
                document.getElementById('start-desc').textContent = uiText[currentLanguage].startDesc;
                document.getElementById('start-btn').textContent = uiText[currentLanguage].startBtn;
                startImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            } 
            else if (gameState === 'playing') {
                const scene = scenes[currentSceneIndex];
                descriptionEl.textContent = scene.description[currentLanguage];
                btnA.textContent = scene.choices.A.text[currentLanguage];
                btnB.textContent = scene.choices.B.text[currentLanguage];
                undoBtn.textContent = uiText[currentLanguage].undoBtn;
                nextBtn.textContent = uiText[currentLanguage].nextBtn;
                
                if (currentChoice) {
                const results = scene.choices[currentChoice].result[currentLanguage];
                resultBoxes.forEach((box, index) => {
                    if (results[index]) {
                        box.textContent = results[index];
                        box.style.display = 'block';
                    }
                    else {
                        box.style.display = 'none'; // 如果該格沒有內容則自動隱藏
                    }
                                                    });
                }
                
                sceneImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            }
            else if (gameState === 'end') {
                document.getElementById('end-title').textContent = uiText[currentLanguage].endTitle;
                document.getElementById('end-desc').textContent = uiText[currentLanguage].endDesc;
                document.getElementById('end-note').textContent = uiText[currentLanguage].endNote;
                document.getElementById('replay-btn').textContent = uiText[currentLanguage].replayBtn;
                endImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            }
        }

        // 從開始選單進入遊戲
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
            gameContent.style.display = 'block';
            loadScene();
        }

        // 載入遊戲場景
        function loadScene() {
            currentChoice = null;
            
            if (currentSceneIndex >= scenes.length) {
                showEndScreen();
                return;
            }

            const scene = scenes[currentSceneIndex];
            sceneImage.src = scene.image; 
            
            choicesDiv.style.display = 'flex';
            resultContainer.style.display = 'none';

            updateUI();
        }

        // 玩家做出選擇
        function makeChoice(choice) {
            currentChoice = choice;
            choicesDiv.style.display = 'none';
            resultContainer.style.display = 'block';
            updateUI();
        }
        // 玩家重新選擇
        function undoChoice() {
            currentChoice = null;
            resultContainer.style.display = 'none';
            choicesDiv.style.display = 'flex';
        }
        // 前往下一幕
        function nextScene() {
            currentSceneIndex++;
            loadScene();
        }

        // 顯示通關結束畫面
        function showEndScreen() {
            gameState = 'end';
            gameContent.style.display = 'none';
            endScreen.style.display = 'block';
            endImage.src = "end_image.png";
            updateUI();
        }

        // 初始化網站（顯示開始選單）
        updateUI();
    </script>
</body>
</html>

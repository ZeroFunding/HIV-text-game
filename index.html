<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 in 500</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", -apple-system, sans-serif;
            background-color: #2c3e50;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-container {
            background-color: #ecf0f1;
            width: 100%;
            max-width: 800px; 
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        /* 語言切換按鈕 */
        #lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: 0.3s;
            z-index: 10;
        }
        #lang-toggle:hover {
            background-color: #7f8c8d;
        }
        
        /* 圖片通用樣式 */
        .scene-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
            background-color: #bdc3c7;
            margin-top: 20px;
        }

        /* 文字通用樣式 */
        .text-desc {
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* 開始畫面專屬樣式 */
        #start-title {
            color: #2c3e50;
            font-size: 2.5em;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        #start-btn {
            background-color: #f39c12;
            padding: 20px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            white-space: normal;
        }
        #start-btn:hover {
            background-color: #e67e22;
        }

        /* 遊戲主要畫面樣式 */
        #game-content {
            display: none; /* 初始隱藏，點擊開始後顯示 */
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .choice-btn {
            padding: 20px 25px;
            font-size: 1.1em;
            line-height: 1.5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            white-space: normal; 
            word-wrap: break-word;
        }
        .choice-btn:hover {
            background-color: #2980b9;
        }
        #result-container {
            display: none;
            margin-bottom: 20px;
        }
        .result-box {
            background-color: #dff9fb;
            padding: 20px 25px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 6px solid #22a6b3;
            text-align: left;
            font-size: 1.15em;
            line-height: 1.6;
        }
        .result-box.fact-box {
            background-color: #82de6b;
            border-left-color: #4b854d;
        }
        .result-box.note-box {
            background-color: #FFFFFF;
            border-left-color: #FFFFFF;
            color: #8c4a4a;
        }
        #next-btn {
            background-color: #2ecc71;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            display: block;
            width: 100%;
        }
        #next-btn:hover {
            background-color: #27ae60;
        }

        /* 結束畫面 */
        .end-screen {
            padding: 40px 0;
            display: none;
        }
        .end-screen h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .end-screen p {
            font-size: 1.4em;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .end-screen button {
            background-color: #e74c3c;
            padding: 20px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        .end-screen button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="lang-toggle" onclick="toggleLanguage()">English</button>
        
        <!-- 開始選單畫面 -->
        <div id="start-screen">
            <h1 id="start-title"></h1>
            <img id="start-image" class="scene-img" src="start_image.png" alt="Start Menu Image">
            <div id="start-desc" class="text-desc"></div>
            <button id="start-btn" onclick="startGame()"></button>
        </div>

        <!-- 遊戲主要場景畫面 -->
        <div id="game-content">
            <img id="scene-image" class="scene-img" src="" alt="Scene Image">
            <div id="description" class="text-desc">Loading...</div>
            
            <div class="choices-container" id="choices">
                <button class="choice-btn" id="btn-a" onclick="makeChoice('A')">Choice A</button>
                <button class="choice-btn" id="btn-b" onclick="makeChoice('B')">Choice B</button>
            </div>

            <div id="result-container">
                <div id="result-text-1" class="result-box"></div>
                <div id="result-text-2" class="result-box fact-box"></div>
                <div id="result-text-3" class="result-box note-box"></div>
                <button id="next-btn" onclick="nextScene()">Next Scene</button>
            </div>
        </div>

        <!-- 結束畫面 -->
        <div id="end-screen" class="end-screen">
            <h1 id="end-title"></h1>
            <img id="end-image" class="scene-img" src="end_image.png" alt="End Screen Image">
            <p id="end-desc"></p>
            <button id="replay-btn" onclick="location.reload()"></button>
        </div>
    </div>

    <script>
        // Button Content
        const uiText = {
            zh: {
                toggleBtn: "English",
                startTitle: "1 in 500",
                startDesc: "1 in 500：HIV感染者的處境",
                startBtn: "開始遊戲",
                nextBtn: "前往下一幕",
                endTitle: "冒險結束！",
                endDesc: "恭喜你通關了這個小遊戲！",
                replayBtn: "再玩一次",
                imgError: "圖片缺失"
            },
            en: {
                toggleBtn: "繁體中文",
                startTitle: "1 in 500",
                startDesc: "1 in 500:  What a person living with HIV faces",
                startBtn: "Start Game",
                nextBtn: "Proceed to Next Scene",
                endTitle: "Adventure Completed!",
                endDesc: "Congratulations on clearing this mini-game!",
                replayBtn: "Play Again",
                imgError: "Image not found"
            }
        };

        // Scene Content
        const scenes = [
            {
                image: "image_1.png",
                description: {
                    zh: "【場景一：夜晚】你們已經交往了幾個星期。今晚，事情進展得比以往更快。你伸手去抽屜裡找安全套。她靠過來，聲音很輕：「沒關係，我今天是安全期。」氣氛溫熱，她在等你。",
                    en: "[Scene 1: Night] You have been seeing this person for a few weeks. Tonight, things are moving faster than before. You reach for the drawer, attempting to get the condom. She said, \"It is fine; I am in my safe period.\" The atmosphere is good, and your partner is waiting."
                },
                choices: {
                    A: { 
                        text: { zh: "XxX", en: "XxX" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] } 
                    },
                    B: { 
                        text: { zh: "xxx", en: "xxx" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] }
                    }
            },
            {
                image: "image_2.png",
                description: {
                    zh: "【場景二：那條訊息】那一夜之後，你醒來。你還在回味，很快就把這件事忘了，繼續過正常生活。兩/三個星期後，你的手機響了。一條陌生號碼的WhatsApp訊息。「嘿，我是那天晚上的[X]。我剛發現自己感染了HIV。你應該去檢測一下。」你盯著螢幕，文字一動不動。你腦裡一片空白。你完全震驚了，不知道該怎麼辦。你也不確定去哪裡、怎麼做HIV檢測。",
                    en: "[Scene 2] After the night, you wake up. You were content and you quickly forgot what happened. You continue with your normal life. Two weeks later. Your phone buzzes. An unknown WhatsApp message. Hey. It is [X] from that night. I just found out I have HIV. You should get tested. You stare at the screen. The words don’t move; you are shocked and don’t know what to do. You are not sure where or how to get an HIV test."
                },
                choices: {
                    A: { 
                        text: { zh: "XxX", en: "XxX" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] } 
                    },
                    B: { 
                        text: { zh: "xxx", en: "xxx" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] }
                    }
            },
            {
                image: "image_3.png",
                description: {
                    zh: "【場景三：兩種檢測】做了一些資料搜集後，你發現檢測方法有兩種。你會選哪一種？",
                    en: "[Scene 3] After a bit of research, you find out that testing methods can be 2 kinds. What will you choose?"
                },
                choices: {
                    A: { 
                        text: { zh: "XxX", en: "XxX" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] } 
                    },
                    B: { 
                        text: { zh: "xxx", en: "xxx" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] }
                    }
            },
            {
                image: "image_4.png",
                description: {
                    zh: "【場景四：X】X",
                    en: "[Scene 4] X"
                },
                choices: {
                    A: { 
                        text: { zh: "XxX", en: "XxX" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] } 
                    },
                    B: { 
                        text: { zh: "xxx", en: "xxx" }, 
                        result: { zh: ["XXX", 
                                       "BBB",
                                       "CCC"],
                                  en: ["XXX", 
                                       "BBB",
                                       "CCC"] }
                    }
                }
            }
        ];

        // 遊戲狀態變數
        let currentSceneIndex = 0;
        let currentLanguage = 'zh'; // 預設語言為繁體中文
        let currentChoice = null;   // 記錄當下選擇了哪個選項
        let gameState = 'start';    // 'start', 'playing', 'end'

        // DOM 元素
        const langToggleBtn = document.getElementById('lang-toggle');
        const startScreen = document.getElementById('start-screen');
        const gameContent = document.getElementById('game-content');
        const endScreen = document.getElementById('end-screen');
        const endImage = document.getElementById('end-image');
        
        const sceneImage = document.getElementById('scene-image');
        const startImage = document.getElementById('start-image');
        const descriptionEl = document.getElementById('description');
        const choicesDiv = document.getElementById('choices');
        const btnA = document.getElementById('btn-a');
        const btnB = document.getElementById('btn-b');
        const resultContainer = document.getElementById('result-container');
        const resultBoxes = [
            document.getElementById('result-text-1'),
            document.getElementById('result-text-2'),
            document.getElementById('result-text-3')];
        const nextBtn = document.getElementById('next-btn');

        // 生成 SVG 錯誤圖片的輔助函數
        function getErrorImageSvg(msg) {
            return `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='350' viewBox='0 0 800 350'%3E%3Crect fill='%23bdc3c7' width='800' height='350'/%3E%3Ctext fill='%237f8c8d' x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='24'%3E${msg}%3C/text%3E%3C/svg%3E`;
        }

        // 切換語言功能
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        // 更新畫面上的所有文字
        function updateUI() {
            langToggleBtn.textContent = uiText[currentLanguage].toggleBtn;
            const errorMsg = uiText[currentLanguage].imgError;
            
            if (gameState === 'start') {
                document.getElementById('start-title').textContent = uiText[currentLanguage].startTitle;
                document.getElementById('start-desc').textContent = uiText[currentLanguage].startDesc;
                document.getElementById('start-btn').textContent = uiText[currentLanguage].startBtn;
                startImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            } 
            else if (gameState === 'playing') {
                const scene = scenes[currentSceneIndex];
                descriptionEl.textContent = scene.description[currentLanguage];
                btnA.textContent = scene.choices.A.text[currentLanguage];
                btnB.textContent = scene.choices.B.text[currentLanguage];
                nextBtn.textContent = uiText[currentLanguage].nextBtn;

                if (currentChoice) {
                const results = scene.choices[currentChoice].result[currentLanguage];
                resultBoxes.forEach((box, index) => {
                    if (results[index]) {
                        box.textContent = results[index];
                        box.style.display = 'block';
                    }
                    else {
                        box.style.display = 'none'; // 如果該格沒有內容則自動隱藏
                    }
                                                    });
                }
                
                sceneImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            }
            else if (gameState === 'end') {
                document.getElementById('end-title').textContent = uiText[currentLanguage].endTitle;
                document.getElementById('end-desc').textContent = uiText[currentLanguage].endDesc;
                document.getElementById('replay-btn').textContent = uiText[currentLanguage].replayBtn;
                endImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            }
        }

        // 從開始選單進入遊戲
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
            gameContent.style.display = 'block';
            loadScene();
        }

        // 載入遊戲場景
        function loadScene() {
            currentChoice = null;
            
            if (currentSceneIndex >= scenes.length) {
                showEndScreen();
                return;
            }

            const scene = scenes[currentSceneIndex];
            sceneImage.src = scene.image; 
            
            choicesDiv.style.display = 'flex';
            resultContainer.style.display = 'none';

            updateUI();
        }

        // 玩家做出選擇
        function makeChoice(choice) {
            currentChoice = choice;
            choicesDiv.style.display = 'none';
            resultContainer.style.display = 'block';
            updateUI();
        }

        // 前往下一幕
        function nextScene() {
            currentSceneIndex++;
            loadScene();
        }

        // 顯示通關結束畫面
        function showEndScreen() {
            gameState = 'end';
            gameContent.style.display = 'none';
            endScreen.style.display = 'block';
            endImage.src = "end_image.png";
            updateUI();
        }

        // 初始化網站（顯示開始選單）
        updateUI();
    </script>
</body>
</html>

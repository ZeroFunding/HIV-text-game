<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷你文字冒險 / Mini Text Adventure</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", -apple-system, sans-serif;
            background-color: #2c3e50;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-container {
            background-color: #ecf0f1;
            width: 100%;
            max-width: 800px; 
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        /* 語言切換按鈕 */
        #lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: 0.3s;
            z-index: 10;
        }
        #lang-toggle:hover {
            background-color: #7f8c8d;
        }
        
        /* 圖片通用樣式 */
        .scene-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
            background-color: #bdc3c7;
            margin-top: 20px;
        }

        /* 文字通用樣式 */
        .text-desc {
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* 開始畫面專屬樣式 */
        #start-title {
            color: #2c3e50;
            font-size: 2.5em;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        #start-btn {
            background-color: #f39c12;
            padding: 20px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            white-space: normal;
        }
        #start-btn:hover {
            background-color: #e67e22;
        }

        /* 遊戲主要畫面樣式 */
        #game-content {
            display: none; /* 初始隱藏，點擊開始後顯示 */
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .choice-btn {
            padding: 20px 25px;
            font-size: 1.1em;
            line-height: 1.5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            white-space: normal; 
            word-wrap: break-word;
        }
        .choice-btn:hover {
            background-color: #2980b9;
        }
        #result-container {
            display: none;
            background-color: #dff9fb;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid #22a6b3;
            text-align: left;
        }
        #result-text {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        #next-btn {
            background-color: #2ecc71;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            display: block;
            width: 100%;
        }
        #next-btn:hover {
            background-color: #27ae60;
        }

        /* 結束畫面 */
        .end-screen {
            padding: 40px 0;
            display: none;
        }
        .end-screen h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .end-screen p {
            font-size: 1.4em;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .end-screen button {
            background-color: #e74c3c;
            padding: 20px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        .end-screen button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="lang-toggle" onclick="toggleLanguage()">English</button>
        
        <!-- 開始選單畫面 -->
        <div id="start-screen">
            <h1 id="start-title"></h1>
            <img id="start-image" class="scene-img" src="start_image.png" alt="Start Menu Image">
            <div id="start-desc" class="text-desc"></div>
            <button id="start-btn" onclick="startGame()"></button>
        </div>

        <!-- 遊戲主要場景畫面 -->
        <div id="game-content">
            <img id="scene-image" class="scene-img" src="" alt="Scene Image">
            <div id="description" class="text-desc">Loading...</div>
            
            <div class="choices-container" id="choices">
                <button class="choice-btn" id="btn-a" onclick="makeChoice('A')">Choice A</button>
                <button class="choice-btn" id="btn-b" onclick="makeChoice('B')">Choice B</button>
            </div>

            <div id="result-container">
                <div id="result-text"></div>
                <button id="next-btn" onclick="nextScene()">Next Scene</button>
            </div>
        </div>

        <!-- 結束畫面 -->
        <div id="end-screen" class="end-screen">
            <h1 id="end-title"></h1>
            <p id="end-desc"></p>
            <button id="replay-btn" onclick="location.reload()"></button>
        </div>
    </div>

    <script>
        // 雙語靜態文字字典
        const uiText = {
            zh: {
                toggleBtn: "English",
                startTitle: "1 in 500",
                startDesc: "1 in 500：HIV感染者的處境",
                startBtn: "開始遊戲",
                nextBtn: "前往下一幕",
                endTitle: "冒險結束！",
                endDesc: "恭喜你通關了這個小遊戲！",
                replayBtn: "再玩一次",
                imgError: "圖片缺失"
            },
            en: {
                toggleBtn: "繁體中文",
                startTitle: "1 in 500",
                startDesc: "1 in 500:  What a person living with HIV faces",
                startBtn: "Start Game",
                nextBtn: "Proceed to Next Scene",
                endTitle: "Adventure Completed!",
                endDesc: "Congratulations on clearing this mini-game!",
                replayBtn: "Play Again",
                imgError: "Image not found"
            }
        };

        // 場景資料（包含中英雙語）
        const scenes = [
            {
                image: "image_1.png",
                description: {
                    zh: "【場景一：夜晚】你們已經交往了幾個星期。今晚，事情進展得比以往更快。你伸手去抽屜裡找安全套。她說：「沒關係，我在安全期。」氣氛溫熱，她在等你。",
                    en: "[Scene 1: Night] You have been seeing this person for a few weeks. Tonight, things are moving faster than before. You reach for the drawer, attempting to get the foil. She said, \"It is fine; I am out of the period. It is warm, and they are waiting.\""
                },
                choices: {
                    A: { 
                        text: { zh: "「就這一次，沒關係。」", en: "It’s fine. Just this once." }, 
                        result: { zh: "事情發生了，感覺很好。HIV可以透過無保護性行為傳播。但性行為之後，仍然可以預防。如果你發生了高危性行為，PEP（暴露後預防）在72小時內開始服用可以預防感染。如果你有性生活，每3–6個月定期檢測是唯一知道自己狀態的方法。一夜不會定義你。", 
                                  en: "It happens; it is good. HIV can be transmitted through unprotected sex. After sex, it is still preventable. If you have unsafe sex, PEP (post-exposure prophylaxis) can prevent infection if started within 72 hours. Regular testing, every 3-6 months if sexually active, is the only way to know your status. One night does not define you." 
                                } 
                    },
                    B: { 
                        text: { zh: "「我們停下吧，我沒有保護措施。」", en: "Let’s stop. I don’t have protection." }, 
                        result: { zh: "你說了出來。房間的溫度降了一度。她說：「你說得對。性行為應該使用安全套這樣的保護措施。」（安全套預防HIV的有效率約為80–95%）結果發現安全套已經用完了，她說沒關係。無保護性行為還是發生了。", 
                                  en: "You say it. The room cools by a degree. She said, \"You are right. Protective measures like condoms should be used for sex.\"(condoms can be used to prevent HIV by 80-95%). Turn out all the condoms are used up, and she said that’s fine, the aroma is great. Unprotected sex is performed." 
                                } 
                    }
                }
            },
            {
                image: "image_2.png",
                description: {
                    zh: "【場景二：那條訊息】那一夜之後，你醒來。你還在回味，很快就把這件事忘了，繼續過正常生活。兩/三個星期後，你的手機響了。一條陌生號碼的WhatsApp訊息。「嘿，我是那天晚上的[X]。我剛發現自己感染了HIV。你應該去檢測一下。」你盯著螢幕。字沒有動；你完全震驚了，不知道該怎麼辦。你也不確定去哪裡、怎麼做HIV檢測。",
                    en: "[Scene 2] After the night, you wake up. You were still enjoying and you quickly forget what happens and continue engages in you normal life. Two weeks later. Your phone buzzes. An unknown WhatsApp message. Hey. It is [X] from that night. I just found out I have HIV. You should get tested. You stare at the screen. The words don’t move; you are totally shocked and don’t know what to do. You are not sure where or how to get an HIV test."
                },
                choices: {
                    A: { 
                        text: { zh: "當作什麼都沒發生。告訴自己你沒事。", en: "Assume nothing happens. Tell yourself you are fine." }, 
                        result: { zh: "你把手機扣在桌上。你刪掉了聊天記錄。你去上班、吃午飯。你覺得這兩三個星期以來什麼都沒變。某天晚上，你睡不著，發現自己發燒、發冷。你檢查自己的皮膚和喉嚨，發現和HIV皮疹的特徵很像。你打開手機；你知道這次不能再拖了，於是搜尋HIV檢測。事實： 逃避是面對恐懼的正常反應，但它會延誤治療。HIV如果不治療，會隨著時間削弱免疫系統。越早檢測，越早可以行動。", 
                                  en: "You put your phone face down. You delete the chat. You go to work, eat lunch. You feel nothing has changed after these three weeks. One night, you can’t sleep, finding yourself with a fever and chills. You have checked your skin and throat, find similar traits with HIV rash. You open your phone; you know you cannot delay this time, so you search for HIV testing. Fact: Avoidance is a normal response to fear, but it delays treatment. HIV, if left untreated, weakens the immune system over time. The earlier you test, the earlier you can act." 
                                } 
                    },
                    B: { 
                        text: { zh: "今天就預約檢測。", en: "Book a test. Today." }, 
                        result: { zh: "你找到一家機構。你打電話。「我想預約HIV檢測。」電話那頭的人很平靜、很友善。你可以明天來諮詢醫生，或者你想先領取一個檢測試劑盒？你掛斷電話。你坐在床上。你覺得自己快要吐了。但你預約了。這已經是一種行動。事實： 在香港，公共衛生診所（例如紅絲帶中心、關懷艾滋）的HIV檢測是免費且保密的。你不需要轉介信。在某些站點，你不需要提供真實姓名。檢測是唯一知道自己狀態的方法。", 
                                  en: "You find an organization. You call. “I would like to book an HIV test.” The person on the line is calm and kind. You can come consult the doctor tomorrow, or do you want to pick up a test kit?. You hang up. You sit on your bed. You feel like you are going to be sick. But you booked it. That is something. Fact: HIV testing in Hong Kong is free and confidential at public clinics (e.g., Red Ribbon Center, AIDS Concern). You do not need a referral. You do not need to give your real name at some sites. Testing is the only way to know your status." 
                                } 
                    }
                }
            },
            {
                image: "image_3.png",
                description: {
                    zh: "【場景三：兩種檢測】做了一些資料搜集後，你發現檢測方法有兩種。你會選哪一種？",
                    en: "[Scene 3] After a bit of research, you find out that testing methods can be 2 kinds. What will you choose?"
                },
                choices: {
                    A: { 
                        text: { zh: "快速抗原檢測——採血，20分鐘內出結果", en: "Rapid antigen test: uses blood and obtains results within 20 minutes. " }, 
                        result: { zh: "你要求配送一個快速抗原檢測試劑盒。你很快做了檢測，結果是陰性；你鬆了一口氣。一個月後，你發現症狀沒有消退。你再次訂購試劑盒，這一次結果是陽性。你很擔心，也責怪自己：為什麼第一個試劑盒這麼不準？事實： 快速檢測試劑盒的空窗期最長可達3個月，如果你的高危性行為發生在幾週內，結果可能不準確。血液中病毒量和抗原量低時，可能產生假結果。（需補充參考文獻）", 
                                  en: "You ask for a delivery of a rapid antigen test. You quickly did the test and found the test results were negative; you were relieved. After 1 month, you don’t find symptoms going away. You re-ordered a test kit, and this time found it was positive. You are worried and blame why the first test kit worked so badly. Fact: Rapid test kit has a window period of longest 3 months, it may not be precise if your unsafe sex happens within weeks. A false result may be produced due to low viral and low antigen amounts in blood" } 
                    },
                    B: { 
                        text: { zh: "去診所抽血，送實驗室化驗", en: "Go to a clinic and have blood drawn to obtain results" }, 
                        result: { zh: "護士叫你不用擔心，開始抽血並送往實驗室。一週後結果出來：陽性。你很擔心。事實： 傳統抽血採用另一種檢測方法，更精確，可作為診斷標準。但如果你有高危、頻繁的性行為，無論異性戀還是同性戀，仍建議每3–6個月檢測一次。", 
                                  en: "Nurse said to you no worry, and starts to draw blood and send to laboratory. The results return in 1 week. Results returned positive. You are worried. Fact: Traditional sampling uses another method to sample. It is more precise and acts as a diagnostic criterion. But it is still recommended to test every 3-6 months if you have dangerous and frequent sexual behaviours, whether you are heterosexual or homosexual." } 
                    }
                }
            }
        ];

        // 遊戲狀態變數
        let currentSceneIndex = 0;
        let currentLanguage = 'zh'; // 預設語言為繁體中文
        let currentChoice = null;   // 記錄當下選擇了哪個選項
        let gameState = 'start';    // 'start', 'playing', 'end'

        // DOM 元素
        const langToggleBtn = document.getElementById('lang-toggle');
        const startScreen = document.getElementById('start-screen');
        const gameContent = document.getElementById('game-content');
        const endScreen = document.getElementById('end-screen');
        
        const sceneImage = document.getElementById('scene-image');
        const startImage = document.getElementById('start-image');
        const descriptionEl = document.getElementById('description');
        const choicesDiv = document.getElementById('choices');
        const btnA = document.getElementById('btn-a');
        const btnB = document.getElementById('btn-b');
        const resultContainer = document.getElementById('result-container');
        const resultTextEl = document.getElementById('result-text');
        const nextBtn = document.getElementById('next-btn');

        // 生成 SVG 錯誤圖片的輔助函數
        function getErrorImageSvg(msg) {
            return `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='350' viewBox='0 0 800 350'%3E%3Crect fill='%23bdc3c7' width='800' height='350'/%3E%3Ctext fill='%237f8c8d' x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='24'%3E${msg}%3C/text%3E%3C/svg%3E`;
        }

        // 切換語言功能
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        // 更新畫面上的所有文字
        function updateUI() {
            langToggleBtn.textContent = uiText[currentLanguage].toggleBtn;
            const errorMsg = uiText[currentLanguage].imgError;
            
            if (gameState === 'start') {
                document.getElementById('start-title').textContent = uiText[currentLanguage].startTitle;
                document.getElementById('start-desc').textContent = uiText[currentLanguage].startDesc;
                document.getElementById('start-btn').textContent = uiText[currentLanguage].startBtn;
                startImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            } 
            else if (gameState === 'playing') {
                const scene = scenes[currentSceneIndex];
                descriptionEl.textContent = scene.description[currentLanguage];
                btnA.textContent = scene.choices.A.text[currentLanguage];
                btnB.textContent = scene.choices.B.text[currentLanguage];
                nextBtn.textContent = uiText[currentLanguage].nextBtn;

                if (currentChoice) {
                    resultTextEl.textContent = scene.choices[currentChoice].result[currentLanguage];
                }
                
                sceneImage.onerror = function() { this.src = getErrorImageSvg(errorMsg); };
            }
            else if (gameState === 'end') {
                document.getElementById('end-title').textContent = uiText[currentLanguage].endTitle;
                document.getElementById('end-desc').textContent = uiText[currentLanguage].endDesc;
                document.getElementById('replay-btn').textContent = uiText[currentLanguage].replayBtn;
            }
        }

        // 從開始選單進入遊戲
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
            gameContent.style.display = 'block';
            loadScene();
        }

        // 載入遊戲場景
        function loadScene() {
            currentChoice = null;
            
            if (currentSceneIndex >= scenes.length) {
                showEndScreen();
                return;
            }

            const scene = scenes[currentSceneIndex];
            // 每次載入新場景重置 src 以觸發載入或錯誤事件
            sceneImage.src = scene.image; 
            
            choicesDiv.style.display = 'flex';
            resultContainer.style.display = 'none';

            updateUI();
        }

        // 玩家做出選擇
        function makeChoice(choice) {
            currentChoice = choice;
            choicesDiv.style.display = 'none';
            resultContainer.style.display = 'block';
            updateUI();
        }

        // 前往下一幕
        function nextScene() {
            currentSceneIndex++;
            loadScene();
        }

        // 顯示通關結束畫面
        function showEndScreen() {
            gameState = 'end';
            gameContent.style.display = 'none';
            endScreen.style.display = 'block';
            updateUI();
        }

        // 初始化網站（顯示開始選單）
        updateUI();
    </script>
</body>
</html>
